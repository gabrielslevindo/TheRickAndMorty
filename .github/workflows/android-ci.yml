name: Android CI

on:
  pull_request:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup do Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3️⃣ Permissão do Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Testes unitários
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 5️⃣ Detekt
      - name: Run Detekt
        run: ./gradlew detekt

      # 6️⃣ Kotlin Lint (style)
      - name: Run Kotlin Lint
        run: ./gradlew lintKotlin

      # 7️⃣ JaCoCo (coverage + regra mínima)
      - name: Run JaCoCo coverage
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      # 8️⃣ Upload do relatório JaCoCo
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html

      # 9️⃣ Build do APK debug
      - name: Build debug APK
        run: ./gradlew assembleDebug
